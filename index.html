<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KFLIX</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-512.png">
  <meta name="theme-color" content="#060608">
  <style>
    body {
      margin: 0;
      background: #1a1a2e;
      color: white;
      font-family: sans-serif;
    }
    .topo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #16162a;
    }
    .topo button {
      background: #2d2d4a;
      color: white;
      border: none;
      font-size: 22px;
      padding: 10px 16px;
      border-radius: 12px;
    }
    .topo h1 {
      margin: 0;
      font-size: 26px;
    }
    .menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      height: 100%;
      box-sizing: border-box;
      overflow-y: auto;
      background: #16162a;
      padding: 16px;
      transform: translateX(-100%);
      transition: transform 0.25s;
      z-index: 10;
    }
    .menu.aberto {
      transform: translateX(0);
    }
    .menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: #2d2d4a;
      color: white;
      border: none;
      padding: 14px;
      font-size: 18px;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .menu button.ativa {
      background: #6c5ce7;
    }
    .menu button.nova {
      background: transparent;
      border: 2px dashed #6c5ce7;
      text-align: center;
      margin-top: 8px;
    }
    .linha {
      display: flex;
      gap: 8px;
    }
    .linha button {
      margin-bottom: 8px;
    }
    .linha button.apagar {
      width: auto;
      text-align: center;
      background: #4a2d3a;
    }
    .fundo {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 5;
    }
    .fundo.aberto {
      display: block;
    }
    .conteudo {
      padding: 16px;
      text-align: center;
    }
    .vazio {
      opacity: 0.6;
    }
    .bloco {
      margin-bottom: 28px;
    }
    .logo-card {
      position: relative;
      background: #e8e8f0;
      border-radius: 12px;
      padding: 10px;
      margin: 8px auto 12px;
      max-width: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-card.tom-claro { background: #e8e8f0; }
    .logo-card.tom-preto { background: #000000; }
    .logo-card.tom-transparente { background: transparent; }
    .logo-card img {
      max-width: 100%;
      max-height: 80px;
      object-fit: contain;
    }
    .logo-card.grande img { max-height: 120px; }
    .logo-card .tirar, .logo-card .trocar-fundo {
      position: absolute;
      top: 6px;
      width: 32px;
      height: 32px;
      padding: 0;
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 16px;
    }
    .logo-card .tirar { right: 6px; background: #4a2d3a; }
    .logo-card .trocar-fundo { left: 6px; background: #2d2d4a; }

    .cartao {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #2d2d4a;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      text-align: left;
    }
    .cartao .info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .cartao strong { font-size: 18px; overflow-wrap: anywhere; }
    .cartao .detalhe { opacity: 0.8; font-size: 14px; }
    .cartao .apagar {
      background: #4a2d3a;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 16px;
    }
    .capa {
      width: 64px;
      height: 96px;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 8px;
      background: #1a1a2e;
    }
    .capa.vazia {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      border: 2px dashed #555570;
      box-sizing: border-box;
    }
    .estrelas { display: flex; gap: 2px; }
    .estrela {
      background: none;
      border: none;
      color: #555570;
      font-size: 26px;
      padding: 0 2px;
    }
    .estrela.cheia { color: #f5c518; }

    button.add {
      background: transparent;
      color: white;
      border: 2px dashed #6c5ce7;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 16px;
      margin-top: 4px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 20;
      align-items: center;
      justify-content: center;
    }
    .modal.aberto { display: flex; }
    .caixa {
      background: #16162a;
      width: 88%;
      max-width: 380px;
      max-height: 92%;
      overflow-y: auto;
      box-sizing: border-box;
      padding: 20px;
      border-radius: 16px;
      text-align: left;
    }
    .caixa h3 { margin-top: 0; }
    .caixa label { display: block; margin: 12px 0 4px; opacity: 0.8; }
    .caixa input[type="text"], .caixa select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      background: #2d2d4a;
      color: white;
    }
    .linha-capa { display: flex; align-items: center; gap: 12px; }
    .botao-capa {
      background: #2d2d4a;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 16px;
    }
    .botoes { display: flex; gap: 8px; margin-top: 18px; }
    .botoes button {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      color: white;
    }
    .botoes .cancelar { background: #2d2d4a; }
    .botoes .salvar { background: #6c5ce7; }

    /* ===== SECÇÕES DE LIVROS E VÍDEOS ===== */
    .secao-livros-titulo {
      font-size: 24px;
      margin: 24px 0 10px;
      border-bottom: 2px solid #6c5ce7;
      display: inline-block;
      padding-bottom: 4px;
    }
    .carrossel-livros {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 10px 0 16px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .carrossel-livros::-webkit-scrollbar { height: 6px; }
    .carrossel-livros::-webkit-scrollbar-thumb { background: #6c5ce7; border-radius: 10px; }
    .item-livro {
      flex: 0 0 120px;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .item-livro-capa {
      width: 120px;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      background: #1a1a2e;
      cursor: pointer;
    }
    .item-livro-capa.vazia {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      border: 2px dashed #555570;
      box-sizing: border-box;
    }
    .item-livro span {
      margin-top: 6px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
    }

    /* ===== CARROSSEL DE VÍDEOS (FORMATO PAISAGEM) ===== */
    .carrossel-videos .item-livro-capa {
      width: 160px;
      height: 96px;
    }
    .carrossel-videos .item-livro {
      flex: 0 0 160px;
    }

    /* ===== TELA COMPLETA DO LIVRO / VÍDEO ===== */
    .tela-livro {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #141424;
      z-index: 30;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
    }
    .tela-livro.aberta { display: flex; }
    .topo-livro {
      display: flex;
      justify-content: flex-end;
    }
    .btn-fechar-livro {
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
    }
    .centro-livro {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }
    .quadrado-capa {
      width: 240px;
      height: 140px;
      border: 3px solid #ffffff;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.6);
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .quadrado-capa img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .quadrado-livro-padrao {
      width: 180px;
      height: 270px;
    }
    .btn-ler-livro {
      background: #ffffff;
      color: #000;
      border: none;
      padding: 12px 32px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 24px;
      cursor: pointer;
    }
    .info-detalhes-livro {
      text-align: left;
      line-height: 1.6;
      font-size: 15px;
      width: 100%;
      max-width: 400px;
    }
    .info-detalhes-livro h2 { font-size: 22px; margin-bottom: 4px; color: #6c5ce7; }
    .info-detalhes-livro .ano { opacity: 0.7; font-size: 14px; margin-bottom: 12px; }
    .info-detalhes-livro .historias {
      background: #2d2d4a;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .info-detalhes-livro .historias li { margin-bottom: 4px; }

    /* ===== MINIGAMES ===== */
    @keyframes aparecer { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
    @keyframes piscar { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    @keyframes tremer { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
    .mg-cena { padding-top: 8px; }
    .mg-personagem { position: relative; min-height: 280px; margin: 12px 16px 0; cursor: pointer; }
    .mg-senhor { position: absolute; left: 0; bottom: 0; width: 42%; max-width: 170px; }
    .mg-senhor.tremer { animation: tremer 0.5s; }
    .mg-exclamacao {
      position: absolute; left: 22%; top: 40px; font-size: 64px; font-weight: 900; line-height: 1;
      color: #ffffff; -webkit-text-stroke: 3px #000000; opacity: 0; transform: scale(0);
      transition: transform 0.25s, opacity 0.25s; pointer-events: none;
    }
    .mg-exclamacao.visivel { opacity: 1; transform: scale(1); }
    .mg-balao {
      display: none; position: relative; margin-left: 40%; background: #ffffff; color: #000000;
      border: 3px solid #000000; border-radius: 50% / 45%; padding: 24px 22px 26px; box-sizing: border-box;
      font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; line-height: 1.35; text-align: center;
    }
    .mg-balao.aberto { display: block; animation: aparecer 0.25s; }
    .mg-balao::before { content: ''; position: absolute; left: -30px; top: 30%; border-style: solid; border-width: 14px 30px 14px 0; border-color: transparent #000000 transparent transparent; }
    .mg-balao::after { content: ''; position: absolute; left: -24px; top: calc(30% + 3px); border-style: solid; border-width: 11px 24px 11px 0; border-color: transparent #ffffff transparent transparent; }
    .mg-fala { margin: 0; }
    .mg-seta { display: block; text-align: right; font-size: 12px; animation: piscar 1s infinite; }
    .mg-linha { height: 2px; background: #3a3a5a; margin: 16px 0; }
    .mg-lista { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 24px; }
    .mg-jogo { display: flex; align-items: center; gap: 12px; background: #2d2d4a; border-radius: 12px; padding: 10px; text-align: left; user-select: none; transition: transform 0.2s, background 0.2s; }
    .mg-jogo.segurando { background: #3a3a60; transform: scale(0.98); }
    .mg-capa { width: 72px; height: 72px; flex-shrink: 0; object-fit: cover; border-radius: 10px; background: #1a1a2e; pointer-events: none; }
    .mg-capa-vazia { display: flex; align-items: center; justify-content: center; font-size: 28px; border: 2px dashed #555570; box-sizing: border-box; }
    .mg-texto-jogo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .mg-texto-jogo strong { font-size: 18px; overflow-wrap: anywhere; }
    .mg-desc { opacity: 0.8; font-size: 14px; }
    .jogo-imagem { display: block; width: 100%; max-height: 180px; object-fit: contain; background: #1a1a2e; border-radius: 10px; margin-bottom: 8px; }
    .jogo-info { opacity: 0.9; line-height: 1.4; white-space: pre-line; }
  </style>
</head>
<body>
  <div class="topo">
    <button onclick="alternarMenu(true)">❯</button>
    <h1>KFLIX</h1>
  </div>

  <div id="fundo" class="fundo" onclick="alternarMenu(false)"></div>
  <div id="menu" class="menu"></div>
  <div id="conteudo" class="conteudo"></div>

  <input id="arquivo-troca" type="file" accept="image/*" style="display:none">
  <input id="arquivo-logo" type="file" accept="image/*" style="display:none">
  <input id="arquivo-livro" type="file" accept="image/*" style="display:none">
  <input id="arquivo-video" type="file" accept="image/*" style="display:none">

  <!-- MODAL ADICIONAR ITEM -->
  <div id="modal" class="modal">
    <div class="caixa">
      <h3 id="modal-titulo"></h3>
      <label>Nome</label>
      <input id="m-nome" type="text" maxlength="80" placeholder="Digite o nome">
      <label>Capa (opcional)</label>
      <div class="linha-capa">
        <img id="m-previa" class="capa" style="display:none" alt="">
        <button type="button" id="m-botao-capa" class="botao-capa">Escolher capa</button>
      </div>
      <input id="m-arquivo" type="file" accept="image/*" style="display:none">
      <label>Avaliação</label>
      <div id="m-estrelas" class="estrelas"></div>
      <label>Status</label>
      <select id="m-status">
        <option>Na fila</option>
        <option>Em andamento</option>
        <option>Terminei</option>
      </select>
      <div class="botoes">
        <button class="cancelar" onclick="fecharModal()">Cancelar</button>
        <button class="salvar" onclick="salvarItem()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL DE JOGOS -->
  <div id="modal-jogo" class="modal">
    <div class="caixa">
      <img id="jogo-imagem" class="jogo-imagem" alt="">
      <h3 id="jogo-nome"></h3>
      <p id="jogo-info" class="jogo-info"></p>
      <div class="botoes">
        <button class="cancelar" onclick="fecharInfoJogo()">Fechar</button>
      </div>
    </div>
  </div>

  <!-- TELA DE LEITURA / DETALHES (LIVROS E VÍDEOS) -->
  <div id="tela-livro" class="tela-livro">
    <div class="topo-livro">
      <button class="btn-fechar-livro" onclick="fecharTelaLivro()">✕</button>
    </div>
    <div class="centro-livro">
      <div class="quadrado-capa" id="quadrado-capa-box" onclick="escolherCapaAtual()">
        <img id="livro-capa" src="" alt="Capa" style="display:none">
        <span id="livro-capa-vazia" style="font-size: 40px;">🖼️</span>
      </div>
      <button id="btn-acao-principal" class="btn-ler-livro" onclick="acaoPrincipalModal()">LER</button>
      <div class="info-detalhes-livro">
        <h2 id="livro-titulo"></h2>
        <div id="livro-ano" class="ano"></div>
        <div id="bloco-extra-detalhes">
          <strong id="subtitulo-extra">3 Histórias do Livro:</strong>
          <ul id="livro-historias" class="historias"></ul>
        </div>
        <strong>Sinopse / Descrição:</strong>
        <p id="livro-sinopse"></p>
        <div id="bloco-link-youtube" style="display:none; margin-top: 12px;">
          <strong>Link do Vídeo no YouTube:</strong>
          <p id="video-link-txt" style="word-break: break-all; color: #a29bfe; font-size: 13px; margin-top: 4px;"></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const padrao = [
      { id: 'fnaf', nome: "Five Nights at Freddy's" },
      { id: 'poppy', nome: 'Poppy Playtime' },
      { id: 'undertale', nome: 'Undertale' },
      { id: 'bendy', nome: 'Bendy' },
      { id: 'baldi', nome: "Baldi's Basics" },
      { id: 'minigames', nome: 'Minigames' }
    ];

    const livrosFnaf = [
      {
        id: 'ff1',
        nome: '#1 Into the Pit',
        ano: '2019',
        historias: ['Into the Pit', 'To Be Beautiful', 'Count the Ways'],
        sinopse: 'O que Oswald mais deseja é um verão inesquecível. Mas quando descobre uma piscina de bolinhas na pizzaria abandonada, ele se vê transportado diretamente para o passado assustador da Fazbear Entertainment.'
      },
      {
        id: 'ff2',
        nome: '#2 Fetch',
        ano: '2020',
        historias: ['Fetch', 'Lonely Freddy', 'Out of Stock'],
        sinopse: 'Greg encontra um animatrônico canino abandonado chamado Fetch que consegue se conectar diretamente ao seu celular, atendendo seus desejos de formas cada vez mais sinistras e violentas.'
      },
      {
        id: 'ff3',
        nome: '#3 1:35 AM',
        ano: '2020',
        historias: ['1:35 AM', 'Room for One More', 'The New Kid'],
        sinopse: 'Delilah compra uma boneca despertador antiga chamada Ella. Logo ela percebe que, às 1:35 da manhã, um sussurro assustador começa a persegui-la, mesmo quando a boneca não está por perto.'
      },
      {
        id: 'ff4',
        nome: '#4 Step Closer',
        ano: '2020',
        historias: ['Step Closer', 'Dance With Me', 'Coming Home'],
        sinopse: 'Pete amaldiçoa seu próprio destino após ser infectado pela maldição de Foxy, enquanto traz conselhos sombrios de que se você chegar muito perto do pirata, pagará um preço terrível.'
      },
      {
        id: 'ff5',
        nome: '#5 Bunny Call',
        ano: '2020',
        historias: ['Bunny Call', 'In the Flesh', 'The Man in Room 1280'],
        sinopse: 'Bob decide pregar uma peça em sua família durante o acampamento chamando o "Bunny Call", mas logo se arrepende desesperadamente ao tentar proteger seus filhos da criatura da noite.'
      },
      {
        id: 'ff6',
        nome: '#6 Blackbird',
        ano: '2020',
        historias: ['Blackbird', 'The Real Jake', 'Hide-and-Seek'],
        sinopse: 'Nole e Sam criam um animatrônico assustador chamado Blackbird para um projeto escolar de terror. Porém, a criatura ganha vida própria e começa a perseguir a culpa no coração de Nole.'
      },
      {
        id: 'ff7',
        nome: '#7 The Cliffs',
        ano: '2021',
        historias: ['The Cliffs', 'The Breaking Wheel', 'He Told Me Everything'],
        sinopse: 'Robert compra um urso de brinquedo eletrônico chamado Tag-Along Freddy para monitorar seu filho, mas as falhas no sinal começam a mostrar um pesadelo se aproximando.'
      },
      {
        id: 'ff8',
        nome: '#8 Gumdrop Angel',
        ano: '2021',
        historias: ['Gumdrop Angel', 'Sergio\'s Lucky Day', 'What We Found'],
        sinopse: 'Angel deseja desesperadamente a atenção de sua família. Em sua raiva, ela consome uma estátua de doces mágica com consequências assustadoras para a sua própria forma física.'
      },
      {
        id: 'ff9',
        nome: '#9 The Puppet Carver',
        ano: '2021',
        historias: ['The Puppet Carver', 'Jumpstart', 'Pizza Kit'],
        sinopse: 'Jack tenta salvar sua fábrica de fantoches de madeira falida criando uma máquina inovadora, mas a invenção começa a esculpir pesadelos vivos.'
      },
      {
        id: 'ff10',
        nome: '#10 Friendly Face',
        ano: '2021',
        historias: ['Friendly Face', 'Sea Bonnies', 'Together Forever'],
        sinopse: 'Edward encomendou um robô com o rosto de seu gato falecido, mas a criatura mutante que chega revela ser o pesadelo definitivo.'
      },
      {
        id: 'ff11',
        nome: '#11 Prankster',
        ano: '2021',
        historias: ['Prankster', 'Kids at Play', 'Find Player Two'],
        sinopse: 'Jeremiah adora pegadinhas na desenvolvedora de jogos onde trabalha, até que um mistério sangrento com um saco na cabeça transforma o escritório em uma armadilha mortal.'
      },
      {
        id: 'ff12',
        nome: '#12 Felix the Shark',
        ano: '2022',
        historias: ['Felix the Shark', 'The Scoop', 'You\'re the Band'],
        sinopse: 'Um volume bônus especial com três contos nunca antes revelados da coleção Fazbear Frights, estrelando o terrível tubarão animatrônico Felix.'
      }
    ];

    const livrosPizzaplex = [
      {
        id: 'pz1',
        nome: "#1 Lally's Game",
        ano: '2022',
        historias: ["Lally's Game", "Under Construction", "Drowning"],
        sinopse: "Matt adquire um manequim robótico chamado Lally para sua nova casa, mas a presença do brinquedo desperta segredos e pavores aterrorizantes."
      },
      {
        id: 'pz2',
        nome: '#2 Happs',

    function reduzirImagem(arquivo, maximo, tipo, aoTerminar) {
      const leitor = new FileReader();
      leitor.onload = () => {
        const img = new Image();
        img.onload = () => {
          const escala = Math.min(1, maximo / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * escala);
          canvas.height = Math.round(img.height * escala);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          aoTerminar(canvas.toDataURL(tipo, 0.75));
        };
        img.onerror = () => alert('Não consegui abrir essa imagem.');
        img.src = leitor.result;
      };
      leitor.readAsDataURL(arquivo);
    }

    function mgProximaFala() {
      if (!mgLiberado || mgFala < 0) return;
      if (mgFala >= falasSenhorK.length) return;
      mgFala++;
      if (mgFala < falasSenhorK.length) {
        mgMostrarFala();

        if (balao) balao.classList.remove('aberto');

    function cardJogo(jogo) {

      if (jogo.imagem) { capa.src = jogo.imagem; capa.alt = jogo.nome; }

      texto.appendChild(el('strong', '', jogo.nome));
      texto.appendChild(el('span', 'mg-desc', jogo.descricao));
      card.appendChild(texto);
      ligarSegurar(card, jogo);
      return card;
    }

    function ligarSegurar(card, jogo) {
      let timer = null;
      const cancelar = () => { clearTimeout(timer); timer = null; card.classList.remove('segurando'); };
      card.addEventListener('pointerdown', () => {
        card.classList.add('segurando');
        timer = setTimeout(() => {
          timer = null;
          card.classList.remove('segurando');
          if (navigator.vibrate) navigator.vibrate(30);
          abrirInfoJogo(jogo);
        }, MG_TEMPO_SEGURAR);
      });
      card.addEventListener('pointerup', cancelar);
      card.addEventListener('pointerleave', cancelar);
      card.addEventListener('pointercancel', cancelar);
      card.addEventListener('contextmenu', (e) => e.preventDefault());
    }

    function abrirInfoJogo(jogo) {
      const img = document.getElementById('jogo-imagem');
      if (jogo.imagem) { img.src = jogo.imagem; img.style.display = 'block'; }
      else { img.removeAttribute('src'); img.style.display = 'none'; }
      img.alt = jogo.nome;
      document.getElementById('jogo-nome').textContent = jogo.nome;
      document.getElementById('jogo-info').textContent = jogo.info;
      document.getElementById('modal-jogo').classList.add('aberto');
    }

    function desenhar() {
      const menu = document.getElementById('menu');
      menu.innerHTML = '<h2>Categorias</h2>';
      menu.appendChild(criarBotao('Geral', atual === 'geral' ? 'ativa' : '', () => escolher('geral')));

      todas().forEach(c => {
        const linha = el('div', 'linha');
        linha.appendChild(criarBotao(c.nome, atual === c.id ? 'ativa' : '', () => escolher(c.id)));
        if (c.extra) linha.appendChild(criarBotao('✕', 'apagar', () => remover(c.id)));
        menu.appendChild(linha);
      });

      menu.appendChild(criarBotao('+ Nova categoria', 'nova', novaCategoria));

      mgParar();
      const conteudo = document.getElementById('conteudo');
      conteudo.innerHTML = '';

      if (atual === 'minigames') {
        conteudo.appendChild(montarMinigames());
        mgIniciar();
        return;
      }

      let lista = todas();
      let titulo = 'Geral';
      if (atual === 'geral') {
        lista = lista.filter(c => c.id !== 'minigames');
      } else {
        const encontrada = lista.find(c => c.id === atual);
        if (!encontrada) {
          atual = 'geral';
          desenhar();
          return;
        }
        lista = [encontrada];
        titulo = encontrada.nome;
      }

      conteudo.appendChild(el('h2', '', titulo));

      lista.forEach(c => {
        const bloco = el('div', 'bloco');
        bloco.appendChild(cabecalho(c, atual !== 'geral'));

        const doCat = itens.filter(i => i.cat === c.id);
        if (doCat.length === 0) {
          bloco.appendChild(el('p', 'vazio', 'Nada por aqui ainda.'));
        }
        doCat.forEach(i => bloco.appendChild(cartao(i)));

        bloco.appendChild(criarBotao('+ Adicionar em ' + c.nome, 'add', () => abrirModal(c)));
        
        if (c.id === 'fnaf') {
          bloco.appendChild(montarSecaoLivrosFnaf());
          bloco.appendChild(montarSecaoLivrosPizzaplex());
          bloco.appendChild(montarSecaoVideosFnaf());
        }

        conteudo.appendChild(bloco);
      });
    }

    function escolher(id) { atual = id; desenhar(); alternarMenu(false); }

    function desenharEstrelasModal() {
      const caixa = document.getElementById('m-estrelas');
      caixa.innerHTML = '';
      for (let n = 1; n <= 5; n++) {
        const b = el('button', 'estrela' + (n <= notaModal ? ' cheia' : ''), '★');
        b.type = 'button';
        b.onclick = () => { notaModal = (notaModal === n) ? 0 : n; desenharEstrelasModal(); };
        caixa.appendChild(b);
      }
    }

    function abrirModal(cat) {
      catModal = cat;
      notaModal = 0;
      capaModal = '';
      document.getElementById('modal-titulo').textContent = 'Adicionar em ' + cat.nome;
      document.getElementById('m-nome').value = '';
      document.getElementById('m-status').selectedIndex = 0;
      document.getElementById('m-previa').style.display = 'none';
      document.getElementById('m-botao-capa').textContent = 'Escolher capa';
      desenharEstrelasModal();
      document.getElementById('modal').classList.add('aberto');
    }

    function fecharModal() { document.getElementById('modal').classList.remove('aberto'); }

    function salvarItem() {
      const nome = document.getElementById('m-nome').value.trim();
      if (!nome) { alert('Escreva o nome primeiro!'); return; }
      itens.push({
        id: 'i' + Date.now(),
        cat: catModal.id,
        nome: nome,
        nota: notaModal,
        capa: capaModal,
        status: document.getElementById('m-status').value
      });
      if (!guardar('kflix_itens', itens)) {
        itens.pop();
        alert('Sem espaço para guardar. Tente sem capa ou apague algum item.');
        return;
      }
      fecharModal();
      desenhar();
    }

    function apagarItem(id) {
      const item = itens.find(i => i.id === id);
      if (!item) return;
      if (!confirm('Apagar "' + item.nome + '"?')) return;
      itens = itens.filter(i => i.id !== id);
      guardar('kflix_itens', itens);
      desenhar();
    }

    function novaCategoria() {
      const resposta = prompt('Nome da nova categoria:');
      if (!resposta) return;
      const nome = resposta.trim();
      if (!nome) return;
      if (todas().some(c => c.nome.toLowerCase() === nome.toLowerCase())) {
        alert('Essa categoria já existe!');
        return;
      }
      const id = 'x' + Date.now();
      extras.push({ id: id, nome: nome, extra: true });
      guardar('kflix_categorias', extras);
      escolher(id);
    }

    function remover(id) {
      const cat = extras.find(c => c.id === id);
      if (!cat) return;
      if (!confirm('Apagar a categoria "' + cat.nome + '" e tudo que tem nela?')) return;
      extras = extras.filter(c => c.id !== id);
      itens = itens.filter(i => i.cat !== id);
      delete logos[id];
      delete fundos[id];
      if (atual === id) atual = 'geral';
      guardar('kflix_categorias', extras);
      guardar('kflix_itens', itens);
      guardar('kflix_logos', logos);
      guardar('kflix_fundos', fundos);
      desenhar();
    }

    function alternarMenu(abrir) {
      document.getElementById('menu').classList.toggle('aberto', abrir);
      document.getElementById('fundo').classList.toggle('aberto', abrir);
    }

    document.getElementById('m-botao-capa').onclick = () => { document.getElementById('m-arquivo').click(); };
    document.getElementById('m-arquivo').onchange = (e) => {
      const arquivo = e.target.files[0];
      e.target.value = '';
      if (!arquivo) return;
      reduzirImagem(arquivo, 360, 'image/jpeg', (dados) => {
        capaModal = dados;
        const previa = document.getElementById('m-previa');
        previa.src = dados;
        previa.style.display = 'block';
        document.getElementById('m-botao-capa').textContent = 'Trocar capa';
      });
    };

    document.getElementById('arquivo-troca').onchange = (e) => {
      const arquivo = e.target.files[0];
      e.target.value = '';
      if (!arquivo) return;
      const item = itens.find(i => i.id === itemTroca);
      if (!item) return;
      reduzirImagem(arquivo, 360, 'image/jpeg', (dados) => {
        const antiga = item.capa;
        item.capa = dados;
        if (!guardar('kflix_itens', itens)) {
          item.capa = antiga;
          alert('Sem espaço para guardar essa capa.');
          return;
        }
        desenhar();
      });
    };

    document.getElementById('arquivo-livro').onchange = (e) => {
      const arquivo = e.target.files[0];
      e.target.value = '';
      if (!arquivo || !livroTrocaId) return;
      reduzirImagem(arquivo, 360, 'image/jpeg', (dados) => {
        livrosCapas[livroTrocaId] = dados;
        if (!guardar('kflix_livros_capas', livrosCapas)) {
          alert('Sem espaço para guardar essa capa.');
          return;
        }
        atualizarVisualCapaModal();
        desenhar();
      });
    };

    document.getElementById('arquivo-video').onchange = (e) => {
      const arquivo = e.target.files[0];
      e.target.value = '';
      if (!arquivo || !videoTrocaId) return;
      reduzirImagem(arquivo, 480, 'image/jpeg', (dados) => {
        videosCapas[videoTrocaId] = dados;
        if (!guardar('kflix_videos_capas', videosCapas)) {
          alert('Sem espaço para guardar essa capa.');
          return;
        }
        atualizarVisualCapaModal();
        desenhar();
      });
    };

    document.getElementById('arquivo-logo').onchange = (e) => {
      const arquivo = e.target.files[0];
      e.target.value = '';
      if (!arquivo || !logoTroca) return;
      const id = logoTroca;
      reduzirImagem(arquivo, 500, 'image/png', (dados) => {
        const antiga = logos[id];
        logos[id] = dados;
        if (!guardar('kflix_logos', logos)) {
          if (antiga) logos[id] = antiga; else delete logos[id];
          alert('Sem espaço para guardar essa logo.');
          return;
        }
        desenhar();
      });
    };

    document.getElementById('modal-jogo').onclick = (e) => {
      if (e.target.id === 'modal-jogo') fecharInfoJogo();
    };

    desenhar();
  </script>
</body>
</html>
