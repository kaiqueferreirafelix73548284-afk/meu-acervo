<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KFLIX</title>
    <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-512.png">
  <meta name="theme-color" content="#060608">
  <style>
    body {
      margin: 0;
      background: #1a1a2e;
      color: white;
      font-family: sans-serif;
    }
    .topo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #16162a;
    }
    .topo button {
      background: #2d2d4a;
      color: white;
      border: none;
      font-size: 22px;
      padding: 10px 16px;
      border-radius: 12px;
    }
    .topo h1 {
      margin: 0;
      font-size: 26px;
    }
    .menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 240px;
      height: 100%;
      box-sizing: border-box;
      overflow-y: auto;
      background: #16162a;
      padding: 16px;
      transform: translateX(-100%);
      transition: transform 0.25s;
      z-index: 10;
    }
    .menu.aberto {
      transform: translateX(0);
    }
    .menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: #2d2d4a;
      color: white;
      border: none;
      padding: 14px;
      font-size: 18px;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .menu button.ativa {
      background: #6c5ce7;
    }
    .menu button.nova {
      background: transparent;
      border: 2px dashed #6c5ce7;
      text-align: center;
      margin-top: 8px;
    }
    .linha {
      display: flex;
      gap: 8px;
    }
    .linha button {
      margin-bottom: 8px;
    }
    .linha button.apagar {
      width: auto;
      text-align: center;
      background: #4a2d3a;
    }
    .fundo {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 5;
    }
    .fundo.aberto {
      display: block;
    }
    .conteudo {
      padding: 16px;
      text-align: center;
    }
    .vazio {
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="topo">
    <button onclick="alternarMenu(true)">❯</button>
    <h1>KFLIX</h1>
  </div>

  <div id="fundo" class="fundo" onclick="alternarMenu(false)"></div>
  <div id="menu" class="menu"></div>
  <div id="conteudo" class="conteudo"></div>

  <script>
    // Categorias fixas. Para criar mais pelo código, é só acrescentar uma linha aqui.
    const padrao = [
      { id: 'filmes', nome: 'Filmes' },
      { id: 'jogos', nome: 'Jogos' },
      { id: 'livros', nome: 'Livros' },
      { id: 'minigames', nome: 'Minigames' }
    ];

    // Categorias criadas pelo botão "+ Nova categoria" (ficam salvas no celular)
    let extras = [];
    try {
      extras = JSON.parse(localStorage.getItem('kflix_categorias')) || [];
    } catch (e) {
      extras = [];
    }

    let atual = 'geral';

    function todas() {
      return padrao.concat(extras);
    }

    function salvar() {
      try {
        localStorage.setItem('kflix_categorias', JSON.stringify(extras));
      } catch (e) {}
    }

    function criarBotao(texto, classe, aoClicar) {
      const b = document.createElement('button');
      b.textContent = texto;
      if (classe) b.className = classe;
      b.onclick = aoClicar;
      return b;
    }

    function desenhar() {
      const menu = document.getElementById('menu');
      menu.innerHTML = '<h2>Categorias</h2>';

      menu.appendChild(criarBotao('Geral', atual === 'geral' ? 'ativa' : '', () => escolher('geral')));

      todas().forEach(c => {
        const linha = document.createElement('div');
        linha.className = 'linha';
        linha.appendChild(criarBotao(c.nome, atual === c.id ? 'ativa' : '', () => escolher(c.id)));
        if (c.extra) {
          linha.appendChild(criarBotao('✕', 'apagar', () => remover(c.id)));
        }
        menu.appendChild(linha);
      });

      menu.appendChild(criarBotao('+ Nova categoria', 'nova', novaCategoria));

      const conteudo = document.getElementById('conteudo');
      conteudo.innerHTML = '';

      let lista = todas();
      let titulo = 'Geral';
      if (atual !== 'geral') {
        lista = lista.filter(c => c.id === atual);
        titulo = lista[0].nome;
      }

      const h2 = document.createElement('h2');
      h2.textContent = titulo;
      conteudo.appendChild(h2);

      lista.forEach(c => {
        if (atual === 'geral') {
          const h3 = document.createElement('h3');
          h3.textContent = c.nome;
          conteudo.appendChild(h3);
        }
        const p = document.createElement('p');
        p.className = 'vazio';
        p.textContent = 'Nada por aqui ainda.';
        conteudo.appendChild(p);
      });
    }

    function escolher(id) {
      atual = id;
      desenhar();
      alternarMenu(false);
    }

    function novaCategoria() {
      const resposta = prompt('Nome da nova categoria:');
      if (!resposta) return;
      const nome = resposta.trim();
      if (!nome) return;

      const repetida = todas().some(c => c.nome.toLowerCase() === nome.toLowerCase());
      if (repetida) {
        alert('Essa categoria já existe!');
        return;
      }

      const id = 'x' + Date.now();
      extras.push({ id: id, nome: nome, extra: true });
      salvar();
      escolher(id);
    }

    function remover(id) {
      const cat = extras.find(c => c.id === id);
      if (!cat) return;
      if (!confirm('Apagar a categoria "' + cat.nome + '"?')) return;
      extras = extras.filter(c => c.id !== id);
      if (atual === id) atual = 'geral';
      salvar();
      desenhar();
    }

    function alternarMenu(abrir) {
      document.getElementById('menu').classList.toggle('aberto', abrir);
      document.getElementById('fundo').classList.toggle('aberto', abrir);
    }

    desenhar();
  </script>
</body>
</html>
